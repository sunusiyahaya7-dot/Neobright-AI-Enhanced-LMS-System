services:
  # MariaDB Database
  db:
    image: mariadb:10.6
    container_name: neobright_moodle_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    command: --defaults-file=/etc/mysql/conf.d/mariadb.cnf
    volumes:
      - moodle_db_data:/var/lib/mysql
      - ./mariadb.cnf:/etc/mysql/conf.d/mariadb.cnf:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - neobright

  # Moodle LMS
  moodle:
    image: jhardison/moodle:latest
    container_name: neobright_moodle_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${MOODLE_PORT}:80"
    environment:
      DB_PORT_3306_TCP_ADDR: db
      DB_PORT_3306_TCP_PORT: "3306"
      DB_ENV_MYSQL_DATABASE: ${DB_NAME}
      DB_ENV_MYSQL_USER: ${DB_USER}
      DB_ENV_MYSQL_PASSWORD: ${DB_PASSWORD}
      DB_ENV_MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MOODLE_URL: http://localhost:${MOODLE_PORT}
      PHP_UPLOAD_MAX_FILESIZE: 512M
      PHP_POST_MAX_SIZE: 512M
      PHP_MEMORY_LIMIT: 256M
      PHP_MAX_INPUT_VARS: "5000"
    volumes:
      - moodledata:/var/moodledata
      - ./php.ini.conf:/etc/php/7.4/apache2/conf.d/99-moodle.ini
      - ./moodle-init.sh:/docker-entrypoint.d/moodle-init.sh
    networks:
      - neobright

  # Flask AI Backend
  ai_backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: neobright_ai_backend
    restart: unless-stopped
    # Dev convenience: when ../backend is bind-mounted into /app, the image's
    # preinstalled site-packages can drift from the live requirements.txt.
    # Installing at startup keeps dependencies (e.g., pdfplumber/PyPDF2) in sync.
    command: sh -c "python -m pip install -r requirements.txt && python app.py"
    ports:
      - "${BACKEND_PORT}:5000"
    environment:
      FLASK_ENV: ${FLASK_ENV}
      FLASK_APP: app.py
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      AI_MODEL: ${AI_MODEL}
      AI_TEMPERATURE: ${AI_TEMPERATURE}
      AI_MAX_TOKENS: ${AI_MAX_TOKENS}
      MOODLE_BASE_URL: ${MOODLE_BASE_URL}
      MOODLE_INTERNAL_BASE_URL: ${MOODLE_INTERNAL_BASE_URL}
      MOODLE_HOST_HEADER: ${MOODLE_HOST_HEADER}
      MOODLE_TOKEN: ${MOODLE_TOKEN}
      BACKEND_URL: ${BACKEND_URL}
      FIREBASE_SERVICE_ACCOUNT_PATH: /app/firebase-service-account.json
    volumes:
      - ../backend:/app
      - ../backend/firebase-service-account.json:/app/firebase-service-account.json:ro
    depends_on:
      - moodle
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - neobright

volumes:
  moodle_db_data:
    driver: local
  moodledata:
    driver: local

networks:
  neobright:
    driver: bridge
