services:
  db:
    image: mariadb:10.6
    container_name: neobright_moodle_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - moodle_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  moodle:
    image: jhardison/moodle:latest
    container_name: neobright_moodle_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${MOODLE_PORT}:80"
    environment:
      DB_PORT_3306_TCP_ADDR: db
      DB_PORT_3306_TCP_PORT: "3306"
      DB_ENV_MYSQL_DATABASE: ${DB_NAME}
      DB_ENV_MYSQL_USER: ${DB_USER}
      DB_ENV_MYSQL_PASSWORD: ${DB_PASSWORD}
      DB_ENV_MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MOODLE_URL: http://localhost:${MOODLE_PORT}
    volumes:
      - moodledata:/var/moodledata

volumes:
  moodle_db_data:
  moodle_data:
  moodledata:
